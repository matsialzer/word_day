[project]
name = "worddays"
version = "0.1.0"
description = "WordDay — Telegram-бот для изучения английского"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10,<4",
    "redis>=5.0",
    "tzdata",
    # веб-панель администратора
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
audio = ["edge-tts>=7"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
# FastAPI: Depends()/File()/Query() в значениях по умолчанию - штатный приём фреймворка
"src/worddays/web/**" = ["B008"]
